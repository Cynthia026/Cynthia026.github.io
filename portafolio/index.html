  <head>
    <meta charset="UTF-8" />

      content="Portafolio de Cynthia Martínez García, desarrolladora en Pachuca, Hidalgo: proyectos de desarrollo frontend con JavaScript, Three.js, WebXR y APIs del navegador."

    <script>
      // Aplica el tema guardado antes del primer pintado para evitar parpadeo.
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
